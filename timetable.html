<!DOCTYPE html>
<html lang="cy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_timetable">Timetable – Pembrokeshire Silage Day 2027</title>
  <meta name="theme-color" content="#2c4a1c">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <!-- Easy-read font: the browser only downloads it if the Easy-read option is on -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=fallback" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/translations.js?v=2"></script>
  <script src="js/language.js?v=2"></script>
  <script src="js/comfort.js?v=2"></script>
  <script src="js/first-visit.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="site-header">
    <div class="header-row">
      <a href="index.html"><img class="header-logo" src="images/logo.png" alt="" data-i18n-attr="alt:logo_alt" width="116" height="58"></a>
      <p class="header-date" data-i18n="header_date"></p>
      <div class="header-buttons">
        <button type="button" class="comfort-btn" id="comfort-btn" aria-haspopup="dialog" aria-expanded="false" data-i18n="comfort_btn"></button>
        <a class="safety-btn" href="safety.html" data-i18n="safety_btn"></a>
      </div>
    </div>
  </header>
  <p class="draft-note" data-i18n="draft_note"></p>

  <main>
    <h1 class="page-title" data-i18n="nav_timetable"></h1>
    <p class="page-intro" data-i18n="tt_intro"></p>

    <div class="card">
      <p class="note" style="margin:0" data-i18n="tt_note"></p>
    </div>

    <!-- Each row has data-start and data-end (24-hour clock).
         app.js reads these on the day to show "Live now" or "Starts soon".
         The words for each row are in js/translations.js. -->
    <ol class="timetable" id="timetable">
      <li class="slot key" data-start="10:00" data-end="10:30">
        <div class="time">10:00</div>
        <div class="what"><div class="title" data-i18n="slot_gates"></div><div class="where" data-i18n="slot_gates_w"></div></div>
      </li>
      <li class="slot" data-start="10:30" data-end="11:00">
        <div class="time">10:30</div>
        <div class="what"><div class="title" data-i18n="slot_mowing"></div><div class="where" data-i18n="field_6"></div></div>
      </li>
      <li class="slot" data-start="11:10" data-end="11:40">
        <div class="time">11:10</div>
        <div class="what"><div class="title" data-i18n="slot_tedding"></div><div class="where" data-i18n="field_8"></div></div>
      </li>
      <li class="slot" data-start="11:50" data-end="12:20">
        <div class="time">11:50</div>
        <div class="what"><div class="title" data-i18n="slot_vraking"></div><div class="where" data-i18n="field_11"></div></div>
      </li>
      <li class="slot" data-start="13:10" data-end="13:40">
        <div class="time">13:10</div>
        <div class="what"><div class="title" data-i18n="slot_vharvest"></div><div class="where" data-i18n="field_11"></div></div>
      </li>
      <li class="slot" data-start="14:30" data-end="15:00">
        <div class="time">14:30</div>
        <div class="what"><div class="title" data-i18n="slot_forage"></div><div class="where" data-i18n="field_9"></div></div>
      </li>
      <li class="slot" data-start="14:30" data-end="15:00">
        <div class="time">14:30</div>
        <div class="what"><div class="title" data-i18n="slot_buckrake"></div><div class="where" data-i18n="field_10"></div></div>
      </li>
      <li class="slot key" data-start="17:00" data-end="17:30">
        <div class="time">17:00</div>
        <div class="what"><div class="title" data-i18n="slot_close"></div><div class="where" data-i18n="slot_close_w"></div></div>
      </li>
    </ol>

    <section class="card">
      <h2 data-i18n="allday_h"></h2>
      <div class="expect"><div class="icon" aria-hidden="true">🍔</div><div><b data-i18n="allday_food_b"></b><span data-i18n="allday_food"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🚜</div><div><b data-i18n="allday_mach_b"></b><span data-i18n="allday_mach"></span></div></div>
    </section>
  </main>

  <footer class="site-footer" data-i18n="footer"></footer>

  <nav class="bottom-nav" data-i18n-attr="aria-label:nav_label">
    <ul>
      <li><a href="index.html"><span class="icon" aria-hidden="true">🏠</span><span class="label" data-i18n="nav_home"></span></a></li>
      <li><a href="timetable.html" aria-current="page"><span class="icon" aria-hidden="true">🕒</span><span class="label" data-i18n="nav_timetable"></span></a></li>
      <li><a href="safety.html"><span class="icon" aria-hidden="true">⚠️</span><span class="label" data-i18n="nav_safety"></span></a></li>
      <li><a href="map.html"><span class="icon" aria-hidden="true">🗺️</span><span class="label" data-i18n="nav_map"></span></a></li>
      <li><a href="getting-here.html"><span class="icon" aria-hidden="true">🚗</span><span class="label" data-i18n="nav_getting"></span></a></li>
    </ul>
  </nav>
</div>
<script src="js/app.js?v=2"></script>
</body>
</html>
