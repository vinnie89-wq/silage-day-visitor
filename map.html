<!DOCTYPE html>
<html lang="cy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_map">Site map – Pembrokeshire Silage Day 2027</title>
  <meta name="theme-color" content="#2c4a1c">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <!-- Easy-read font: the browser only downloads it if the Easy-read option is on -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=fallback" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/language.js"></script>
  <script src="js/comfort.js"></script>
  <script src="js/first-visit.js"></script>
</head>
<body>
<div class="app">

  <header class="site-header">
    <div class="header-row">
      <a href="index.html"><img class="header-logo" src="images/logo.png" alt="" data-i18n-attr="alt:logo_alt" width="116" height="58"></a>
      <p class="header-date" data-i18n="header_date"></p>
      <div class="header-buttons">
        <button type="button" class="comfort-btn" id="comfort-btn" aria-haspopup="dialog" aria-expanded="false" data-i18n="comfort_btn"></button>
        <button type="button" class="lang-switch" id="lang-switch" data-i18n="switch_text" data-i18n-attr="aria-label:switch_label;lang:switch_lang"></button>
      </div>
    </div>
  </header>
  <p class="draft-note" data-i18n="draft_note"></p>

  <main>
    <h1 class="page-title" data-i18n="tile_map_b"></h1>
    <p class="page-intro"><span data-i18n="map_intro"></span> <span data-i18n="map_labels_note"></span></p>

    <!-- Zoom buttons: app.js makes them work -->
    <div class="map-tools">
      <span id="zoom-level">100%</span>
      <button type="button" id="zoom-out" data-i18n-attr="aria-label:zoom_out">−</button>
      <button type="button" id="zoom-in" data-i18n-attr="aria-label:zoom_in">+</button>
    </div>

    <div class="map-box" id="map-box">
      <img id="site-map" src="images/site-map.svg" width="895" height="1316" alt="" data-i18n-attr="alt:map_alt">
    </div>

    <section class="card">
      <h2 data-i18n="places_h"></h2>
      <ul class="places">
        <li><span class="dot" style="background:#3f6b25" aria-hidden="true">P</span><div><b data-i18n="place_parks_b"></b><br><span data-i18n="place_parks"></span></div></li>
        <li><span class="dot" style="background:#2c4a1c" aria-hidden="true">£</span><div><b data-i18n="place_gate_b"></b><br><span data-i18n="place_gate"></span></div></li>
        <li><span class="dot" style="background:#2a6fb0" aria-hidden="true">🎧</span><div><b data-i18n="place_info_b"></b><br><span data-i18n="place_info"></span></div></li>
        <li><span class="dot" style="background:#4f8a5f" aria-hidden="true">🌿</span><div><b data-i18n="place_quiet_b"></b><br><span data-i18n="place_quiet"></span></div></li>
        <li><span class="dot" style="background:#e8701a" aria-hidden="true">🍔</span><div><b data-i18n="allday_food_b"></b><br><span data-i18n="allday_food"></span></div></li>
        <li><span class="dot" style="background:#2a6fb0" aria-hidden="true">🚻</span><div><b data-i18n="place_wc_b"></b><br><span data-i18n="place_wc"></span></div></li>
        <li><span class="dot" style="background:#c8202a" aria-hidden="true">✚</span><div><b data-i18n="place_aid_b"></b><br><span data-i18n="place_aid"></span></div></li>
        <li><span class="dot" style="background:#7fa83a" aria-hidden="true">🚜</span><div><b data-i18n="place_demo_b"></b><br><span data-i18n="place_demo"></span></div></li>
      </ul>
      <p class="note" data-i18n="map_keep_away"></p>
    </section>
  </main>

  <footer class="site-footer" data-i18n="footer"></footer>

  <nav class="bottom-nav" data-i18n-attr="aria-label:nav_label">
    <ul>
      <li><a href="index.html"><span class="icon" aria-hidden="true">🏠</span><span class="label" data-i18n="nav_home"></span></a></li>
      <li><a href="timetable.html"><span class="icon" aria-hidden="true">🕒</span><span class="label" data-i18n="nav_timetable"></span></a></li>
      <li><a href="safety.html"><span class="icon" aria-hidden="true">⚠️</span><span class="label" data-i18n="nav_safety"></span></a></li>
      <li><a href="map.html" aria-current="page"><span class="icon" aria-hidden="true">🗺️</span><span class="label" data-i18n="nav_map"></span></a></li>
      <li><a href="getting-here.html"><span class="icon" aria-hidden="true">🚗</span><span class="label" data-i18n="nav_getting"></span></a></li>
    </ul>
  </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
