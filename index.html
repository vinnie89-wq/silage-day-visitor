<!DOCTYPE html>
<html lang="cy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Lets visitors "Add to Home Screen" and open it full-screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Silage Day">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- All the words on this page live in js/translations.js.
       data-i18n="key" says which words go in each element. -->
  <title data-i18n="title_home">Pembrokeshire Silage Day 2027</title>
  <meta name="theme-color" content="#2c4a1c">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <!-- Easy-read font: the browser only downloads it if the Easy-read option is on -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=fallback" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=14">
  <script src="js/translations.js?v=14"></script>
  <script src="js/language.js?v=14"></script>
  <script src="js/comfort.js?v=14"></script>
  <script src="js/first-visit.js?v=14"></script>
</head>
<body>
<div class="app">

  <!-- HEADER: logo, date, Comfort and Safety buttons – the same on every page -->
  <header class="site-header">
    <div class="header-row">
      <a href="index.html"><img class="header-logo" src="images/logo.png" alt="" data-i18n-attr="alt:logo_alt" width="116" height="58"></a>
      <p class="header-date" data-i18n="header_date"></p>
      <div class="header-buttons">
        <button type="button" class="comfort-btn" id="comfort-btn" aria-haspopup="dialog" aria-expanded="false" data-i18n="comfort_btn"></button>
        <a class="safety-btn" href="safety.html" data-i18n="safety_btn"></a>
      </div>
    </div>
  </header>
  <p class="draft-note" data-i18n="draft_note"></p>

  <main>
    <h1 class="visually-hidden" data-i18n="title_home"></h1>

    <!-- Countdown: app.js fills in the number of days and the words -->
    <div class="countdown" id="countdown">
      <b id="days-left">–</b>
      <div id="countdown-text"></div>
    </div>

    <!-- "Add to your Home Screen" tip (js/install.js) – only shown when it can help -->
    <section class="card install-tip" id="install-tip" hidden></section>

    <!-- Latest news (js/news.js) -->
    <section class="card latest-news" id="latest-news" aria-live="polite"></section>

    <section class="card">
      <h2 data-i18n="welcome_h"></h2>
      <p data-i18n="welcome_p1"></p>
      <p data-i18n="welcome_p2"></p>
    </section>

    <section class="card">
      <h2 data-i18n="facts_h"></h2>
      <dl class="facts">
        <dt data-i18n="fact_date_l"></dt><dd data-i18n="fact_date"></dd>
        <dt data-i18n="fact_open_l"></dt><dd data-i18n="fact_open"></dd>
        <dt data-i18n="fact_where_l"></dt><dd data-i18n="fact_where"></dd>
        <dt data-i18n="fact_entry_l"></dt><dd data-i18n="fact_entry"></dd>
        <dt data-i18n="fact_dogs_l"></dt><dd data-i18n="fact_dogs"></dd>
      </dl>
    </section>

    <!-- Shortcut tiles to the other pages -->
    <nav class="tiles" data-i18n-attr="aria-label:quick_label">
      <a class="tile tile-tickets" href="tickets.html"><span class="icon" aria-hidden="true">🎟️</span><b data-i18n="nav_tickets"></b><small data-i18n="tile_tickets"></small></a>
      <a class="tile" href="timetable.html"><span class="icon" aria-hidden="true">🕒</span><b data-i18n="nav_timetable"></b><small data-i18n="tile_timetable"></small></a>
      <a class="tile" href="safety.html"><span class="icon" aria-hidden="true">⚠️</span><b data-i18n="nav_safety"></b><small data-i18n="tile_safety"></small></a>
      <a class="tile" href="map.html"><span class="icon" aria-hidden="true">🗺️</span><b data-i18n="tile_map_b"></b><small data-i18n="tile_map"></small></a>
      <a class="tile" href="photos.html"><span class="icon" aria-hidden="true">📷</span><b data-i18n="nav_photos"></b><small data-i18n="tile_photos"></small></a>
      <a class="tile" href="getting-here.html"><span class="icon" aria-hidden="true">🚗</span><b data-i18n="nav_getting"></b><small data-i18n="tile_getting"></small></a>
    </nav>

    <section class="card">
      <h2 data-i18n="expect_h"></h2>
      <div class="expect"><div class="icon" aria-hidden="true">🚗</div><div><b data-i18n="exp_arrive_b"></b><span data-i18n="exp_arrive"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🎟️</div><div><b data-i18n="exp_gate_b"></b><span data-i18n="exp_gate"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🚜</div><div><b data-i18n="exp_loud_b"></b><span data-i18n="exp_loud"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🍔</div><div><b data-i18n="exp_food_b"></b><span data-i18n="exp_food"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🌿</div><div><b data-i18n="exp_break_b"></b><span data-i18n="exp_break"></span></div></div>
      <div class="expect"><div class="icon" aria-hidden="true">🌻</div><div><b data-i18n="exp_help_b"></b><span data-i18n="exp_help"></span></div></div>
    </section>
  </main>

  <footer class="site-footer" data-i18n="footer"></footer>

  <!-- BOTTOM NAVIGATION – the same on every page.
       aria-current="page" marks the page you're on (it shows in green). -->
  <nav class="bottom-nav" data-i18n-attr="aria-label:nav_label">
    <ul>
      <li><a href="index.html" aria-current="page"><span class="icon" aria-hidden="true">🏠</span><span class="label" data-i18n="nav_home"></span></a></li>
      <li><a href="tickets.html"><span class="icon" aria-hidden="true">🎟️</span><span class="label" data-i18n="nav_tickets"></span></a></li>
      <li><a href="timetable.html"><span class="icon" aria-hidden="true">🕒</span><span class="label" data-i18n="nav_timetable"></span></a></li>
      <li><a href="safety.html"><span class="icon" aria-hidden="true">⚠️</span><span class="label" data-i18n="nav_safety"></span></a></li>
      <li><a href="map.html"><span class="icon" aria-hidden="true">🗺️</span><span class="label" data-i18n="nav_map"></span></a></li>
      <li><a href="photos.html"><span class="icon" aria-hidden="true">📷</span><span class="label" data-i18n="nav_photos"></span></a></li>
    </ul>
  </nav>
</div>
<script src="js/programme.js?v=14"></script>
<script src="js/app.js?v=14"></script>
<script src="js/firebase-config.js?v=14"></script>
<script src="js/firebase.js?v=14"></script>
<script src="js/news.js?v=14"></script>
<script src="js/install.js?v=14"></script>
</body>
</html>
